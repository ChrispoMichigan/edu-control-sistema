{% extends "base.html" %}
{% block title %}EduControl - Lección{% endblock %}
{% block page_title %}Editar lección{% endblock %}

{% block content %}
<div class="page-header enter">
    <div>
        <h1>Editar lección</h1>
        <p>{{ leccion.seccion.curso.nombre }} - {{ leccion.seccion.nombre }}</p>
    </div>
</div>

<div class="card enter">
    <form method="POST" class="form-grid">
        {% csrf_token %}
        <div class="field">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo" value="{{ leccion.titulo }}" required>
        </div>
        <div class="field">
            <label for="texto">Texto</label>
            <textarea id="texto" name="texto" rows="8">{{ leccion.texto }}</textarea>
        </div>
        <div class="field">
            <label for="orden">Orden</label>
            <input type="number" id="orden" name="orden" min="0" value="{{ leccion.orden }}">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-check-circle"/></svg>
                Guardar
            </button>
            <a class="btn btn-outline" href="{% url 'gestionar_contenido' leccion.seccion.curso_id %}">
                <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-chevron-left"/></svg>
                Volver al contenido
            </a>
        </div>
    </form>
</div>
{% endblock %}
