{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduControl - Iniciar sesión</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
    {% include "_icons.html" %}

    <div class="auth-page">
        <div class="auth-card enter">
            <div class="auth-brand">
                <svg class="icon icon-lg" aria-hidden="true"><use href="#icon-academic-cap"/></svg>
                <span>EduControl</span>
            </div>

            <h1>Iniciar sesión</h1>
            <p class="subtitle">Accede con tu correo institucional para continuar.</p>

            {% if error %}
            <div class="alert alert-danger" role="alert">
                <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-x"/></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" class="form-grid">
                {% csrf_token %}

                <div class="field">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" style="width:100%;">
                        <svg class="icon icon-sm" aria-hidden="true"><use href="#icon-lock"/></svg>
                        Ingresar
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
